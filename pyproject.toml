[project]
name = "speech-to-text"
version = "0.1.0"
description = "Microphone dictation to text with faster-whisper, with automatic GPU/CPU detection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.25.0.15",
    "sounddevice>=0.5.5",
]
